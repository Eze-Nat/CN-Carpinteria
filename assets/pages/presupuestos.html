<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN Carpinteria - Productos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav class="navbar container flexRow">
            <picture class="logo">
                <img src="../img/cn-blanco.png" alt="Logo CN Carpinteria">
            </picture>
            <ul class="section flexRow">
                <li class="sectionItem">
                    <a class="sectionLink" href="../../index.html">Inicio</a>
                </li>
                <li class="sectionItem">
                    <a class="sectionLink" href="./productos.html">Productos</a>

                </li>
                <li class="sectionItem">
                    <a class="sectionLink sectionActive" href="./presupuestos.html">Presupuestos</a>
                </li>
                <li class="sectionItem">
                    <a class="sectionLink" href="./contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="mainPresu flexColumn usPage">
        <picture class="bgInicio">
            <img class="bgImg" src="../img/Completo-blanco.png" alt="Fondo CN Carpinteria">
        </picture>

        <form action="" class="presuForm">
            <h2>Pedi tu presupuesto sin cargo!</h2>
            <input type="text" name="Nombre" id="" placeholder="Nombre">
            <input type="text" name="Apellido" id="" placeholder="Apellido">
            <input type="email" name="Email" id="" placeholder="E-Mail">
            <input type="tel" name="tel" id="" placeholder="Celular">
            <textarea name="mensaje" id="" cols="30" rows="10">Escriba aqui su consulta para presupuesto</textarea>
            <input type="button" value="Enviar" id="presuBtn">
        </form>
    </main>
    <footer class="flexColumn">
        <p>Realizamos todo tipo de muebles a medida. Pedi tu cotización sin cargo.</p>
        <p>Todos los derechos reservados</p>
    </footer>
</body>

</html>
