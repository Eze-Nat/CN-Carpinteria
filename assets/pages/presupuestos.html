            </picture>
            <ul class="section flexRow">
                <li class="sectionItem">
                    <a class="sectionLink" href="/index.html">Inicio</a>
                </li>
                <li class="sectionItem">
                    <a class="sectionLink" href="/assets/pages/productos.html">Productos</a>
                    <ul class="subMenu">
                        <li class="subMenuItem">

    <main class="mainPresu flexColumn usPage">
        <picture class="bgInicio">
            <img class="bgImg"  src="/assets/img/Completo-blanco.png" alt="Fondo CN Carpinteria">
        </picture>
        
        <form action="" class="presuForm">
            <h2>Pedi tu presupuesto sin cargo!</h2>
            <input type="text" name="Nombre" id="" placeholder="Nombre">
            <input type="text" name="Apellido" id="" placeholder="Apellido">
            <input type="email" name="Email" id="" placeholder="E-Mail">
            <input type="tel" name="tel" id="" placeholder="Celular">
            <textarea name="mensaje" id="" cols="30" rows="10">Escriba aqui su consulta para presupuesto</textarea>
            <input type="button" value="Enviar" id="presuBtn">
        </form>
    </main>
    <footer class="flexRow">
        <p>Realizamos todo tipo de muebles a medida. Pedi tu cotización sin cargo.</p>
    </footer>
